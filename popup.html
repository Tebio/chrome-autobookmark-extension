<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoBookmark 智能书签栏</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <img src="icons/icon48.png" alt="AutoBookmark Logo" class="logo-icon">
        <div>
          <h1 class="title">AutoBookmark <span class="version-badge" id="headerVersionBadge"></span></h1>
          <span style="font-size: 11px; color: var(--text-secondary); margin-top: 2px; display: block;">智能悬浮书签栏</span>
        </div>
      </div>
      <label class="switch-toggle" title="启用 / 禁用 AutoBookmark">
        <input type="checkbox" id="enableToggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Pin / Shortcut Card -->
    <div class="shortcut-banner">
      <div class="shortcut-info">
        <span class="shortcut-label">快速切换 / 固定</span>
        <kbd class="key-badge">Alt + B</kbd>
      </div>
      <button id="pinToggleBtn" class="btn-secondary">固定书签栏</button>
    </div>

    <!-- Quick Search -->
    <div class="search-section">
      <div class="search-box">
        <svg class="icon-search" viewBox="0 0 24 24">
          <path
            d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
        </svg>
        <input type="text" id="popupSearchInput" placeholder="搜索所有书签...">
      </div>
      <div id="popupSearchResults" class="search-results-list"></div>
    </div>

    <!-- Collapsible Accordion Sections -->
    <div class="accordion-container">

      <!-- 1. Hover & Timing -->
      <div class="accordion-item" id="accTiming">
        <button type="button" class="accordion-header" id="accHeaderTiming">
          <div class="accordion-header-left">
            <svg class="accordion-icon" viewBox="0 0 24 24">
              <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
            </svg>
            <span class="accordion-title">触发与隐藏</span>
          </div>
          <div class="accordion-header-right">
            <span class="accordion-summary" id="sumTiming">8px • 450ms</span>
            <svg class="accordion-chevron" viewBox="0 0 24 24">
              <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
          </div>
        </button>
        <div class="accordion-collapse">
          <div class="accordion-body">
            <div class="setting-item">
              <div class="setting-label-row">
                <span>触发距离</span>
                <span class="val-badge" id="valTrigger">8px</span>
              </div>
              <input type="range" id="triggerHeight" min="2" max="25" value="8" class="range-slider">
              <span class="setting-hint">鼠标靠近屏幕边缘多少像素时显示书签栏</span>
            </div>
            <div class="setting-item">
              <div class="setting-label-row">
                <span>自动隐藏延迟</span>
                <span class="val-badge" id="valDelay">450ms</span>
              </div>
              <input type="range" id="hideDelay" min="100" max="1500" step="50" value="450" class="range-slider">
              <span class="setting-hint">鼠标离开后等待多久自动隐藏</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 2. Appearance & Position -->
      <div class="accordion-item open" id="accAppearance">
        <button type="button" class="accordion-header" id="accHeaderAppearance">
          <div class="accordion-header-left">
            <svg class="accordion-icon" viewBox="0 0 24 24">
              <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.59 10.56 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>
            </svg>
            <span class="accordion-title">外观与位置</span>
          </div>
          <div class="accordion-header-right">
            <span class="accordion-summary" id="sumAppearance">Edge 原生 • 顶部</span>
            <svg class="accordion-chevron" viewBox="0 0 24 24">
              <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
          </div>
        </button>
        <div class="accordion-collapse">
          <div class="accordion-body">
            <div class="theme-grid">
              <label class="theme-card">
                <input type="radio" name="theme" value="edge" checked>
                <div class="theme-preview edge">
                  <div class="bar-sample"></div>
                </div>
                <span class="theme-name">Edge 原生</span>
              </label>

              <label class="theme-card">
                <input type="radio" name="theme" value="dark-glass">
                <div class="theme-preview dark-glass">
                  <div class="bar-sample"></div>
                </div>
                <span class="theme-name">深色玻璃</span>
              </label>

              <label class="theme-card">
                <input type="radio" name="theme" value="modern-light">
                <div class="theme-preview modern-light">
                  <div class="bar-sample"></div>
                </div>
                <span class="theme-name">浅色玻璃</span>
              </label>

              <label class="theme-card">
                <input type="radio" name="theme" value="amoled">
                <div class="theme-preview amoled">
                  <div class="bar-sample"></div>
                </div>
                <span class="theme-name">AMOLED</span>
              </label>

              <label class="theme-card">
                <input type="radio" name="theme" value="chrome">
                <div class="theme-preview chrome">
                  <div class="bar-sample"></div>
                </div>
                <span class="theme-name">经典</span>
              </label>
            </div>

            <div class="setting-row">
              <span class="setting-text">屏幕边缘位置</span>
              <div class="segmented-control">
                <button type="button" class="segment-btn active" data-pos="top">顶部</button>
                <button type="button" class="segment-btn" data-pos="bottom">底部</button>
                <button type="button" class="segment-btn" data-pos="left">左侧</button>
                <button type="button" class="segment-btn" data-pos="right">右侧</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3. Behavior Preferences -->
      <div class="accordion-item" id="accBehavior">
        <button type="button" class="accordion-header" id="accHeaderBehavior">
          <div class="accordion-header-left">
            <svg class="accordion-icon" viewBox="0 0 24 24">
              <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
            <span class="accordion-title">行为偏好</span>
          </div>
          <div class="accordion-header-right">
            <span class="accordion-summary" id="sumBehavior">显示图标</span>
            <svg class="accordion-chevron" viewBox="0 0 24 24">
              <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
          </div>
        </button>
        <div class="accordion-collapse">
          <div class="accordion-body">
            <div class="setting-row">
              <span class="setting-text">在新标签页打开</span>
              <label class="switch-toggle small">
                <input type="checkbox" id="openInNewTab">
                <span class="slider"></span>
              </label>
            </div>

            <div class="setting-row">
              <span class="setting-text">显示网站图标</span>
              <label class="switch-toggle small">
                <input type="checkbox" id="showFavicons" checked>
                <span class="slider"></span>
              </label>
            </div>

            <div class="setting-row">
              <span class="setting-text">悬停显示书签地址</span>
              <label class="switch-toggle small" title="鼠标悬停书签时显示目标网址">
                <input type="checkbox" id="showBookmarkUrl">
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. About & Updates -->
      <div class="accordion-item" id="accAbout">
        <button type="button" class="accordion-header" id="accHeaderAbout">
          <div class="accordion-header-left">
            <svg class="accordion-icon" viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
            <span class="accordion-title">关于与更新</span>
          </div>
          <div class="accordion-header-right">
            <span class="accordion-summary" id="sumAbout">v1.3.0</span>
            <svg class="accordion-chevron" viewBox="0 0 24 24">
              <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
          </div>
        </button>
        <div class="accordion-collapse">
          <div class="accordion-body">
            <!-- GitHub Version & Update Card -->
            <div class="version-card">
              <div class="version-card-left">
                <svg class="github-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path
                    d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                </svg>
                <div class="version-meta">
                  <div class="version-heading">
                    <span class="version-title">GitHub 版本</span>
                    <span class="version-pill" id="currentVersionPill"></span>
                  </div>
                  <span class="version-status" id="versionStatusText">正在检查 GitHub 更新...</span>
                </div>
              </div>
              <a href="https://github.com/Tebio/chrome-autobookmark-extension/releases" target="_blank"
                class="version-action-btn" id="versionActionBtn" title="查看 GitHub Releases">
                发布 ↗
              </a>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="statusText">已在所有网页启用</span>
      </div>
      <button id="resetDefaultsBtn" class="btn-text">重置</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
